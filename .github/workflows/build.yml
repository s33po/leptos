name: Build Image
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  IMAGE_NAME: leptos
  IMAGE_FULL: ghcr.io/${{ github.repository }}
  MAJOR_VERSION: 10
  DEFAULT_TAG: ${{ github.ref_name }}
  BASE_IMG: quay.io/centos/centos:stream10

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for updates
        if: ${{ github.event_name == 'schedule' }}  # Only run if triggered by schedule
        run: |
          upd=0
          podman run --quiet --rm ${{ env.IMAGE_FULL }}:${{ env.DEFAULT_TAG }} dnf check-update || upd=$?

          echo "upd=${upd}" >> "$GITHUB_ENV"
          echo "Exit code from dnf check-update: '${upd}'"

      - name: Set date tag
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        id: date
        run: |
            echo "DATE_TAG=${DEFAULT_TAG}.$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: GHCR Login
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        uses: redhat-actions/podman-login@v1.7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Rechunk image
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        uses: redhat-actions/buildah-build@v2.13
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: |
            ${{ env.IMAGE_FULL }}:${{ env.DEFAULT_TAG }}
            ${{ env.IMAGE_FULL }}:${{ env.DATE_TAG }}
          containerfiles: ./Containerfile
          build-args: |
            BASE_IMG=${{ env.BASE_IMG }}
          extra-args: |
            --cap-add=all
            --security-opt=label=type:container_runtime_t
            --skip-unused-stages=false
            --device /dev/fuse

      - name: Push image
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        uses: redhat-actions/push-to-registry@v2.8
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: |
            ${{ env.IMAGE_FULL }}:${{ env.DEFAULT_TAG }}
            ${{ env.IMAGE_FULL }}:${{ env.DATE_TAG }}
          registry: ${{ env.IMAGE_FULL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          extra-args: |
            --compression-format=zstd:chunked
            --compression-level=3
            --force-compression

      - name: Get digest
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        run: |
          IMAGE_DIGEST=$(podman inspect --format '{{.Digest}}' "${{ env.IMAGE_FULL }}:${{ env.DEFAULT_TAG }}")
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> $GITHUB_ENV

      - name: Install Cosign
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image by digest
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign sign --yes --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY \
          "${{ env.IMAGE_FULL }}@$IMAGE_DIGEST"
