name: Build Image
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: leptos
  MAJOR_VERSION: 10
  DEFAULT_TAG: ${{ github.ref_name }}
  IMAGE_FULL: ghcr.io/${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_push:
    name: "Build and push image"
    runs-on: ubuntu-latest
    container:
      image: "ghcr.io/s33po/podman-action"
      options: "--security-opt=label=disable --privileged --security-opt=seccomp=unconfined --device /dev/fuse:rw --volume /:/run/host:rw"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Check for updates"
        if: ${{ github.event_name == 'schedule' }}  # Only run if triggered by schedule
        shell: "bash"
        run: |
          upd=0
          podman run --quiet --rm ${{ env.IMAGE_FULL }}:${{ env.DEFAULT_TAG }} dnf check-update || upd=$?

          echo "upd=${upd}" >> "$GITHUB_ENV"
          echo "Exit code from dnf check-update: '${upd}'"

      - name: "Setup"
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        shell: "bash"
        run: |
          mkdir -p /github/home/.docker/

      - name: "Build and Rechunk with Chunkah"
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        uses: redhat-actions/buildah-build@v2.13
        with:
          containerfiles: ./Containerfile
          oci: true
          tags: ${{ env.IMAGE_FULL }}:${{ env.DEFAULT_TAG }}
          extra-args: |
            --skip-unused-stages=false
            --security-opt=label=disable
            --volume /__w/leptos/leptos:/run/src

      - name: "GHCR Login"
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        uses: redhat-actions/podman-login@v1.7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          auth_file_path: "/tmp/auth.json"

      - name: "Push image"
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        uses: redhat-actions/push-to-registry@v2.8
        id: "push"
        with:
          tags: ${{ env.IMAGE_FULL }}:${{ env.DEFAULT_TAG }}
          extra-args: |
            --compression-format=zstd:chunked
            --compression-level=3
            --force-compression

      - name: "Install Cosign"
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        uses: sigstore/cosign-installer@v4.1.2

      - name: "Sign image"
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        shell: "bash"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
          IMG: ${{ env.IMAGE_FULL }}
        run: |
          set -euo pipefail
          cosign sign --yes \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMG}@${DIGEST}"
