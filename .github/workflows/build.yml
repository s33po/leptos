name: Build Image
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  IMAGE_NAME: leptos
  IMAGE_FULL: ghcr.io/${{ github.repository }}
  MAJOR_VERSION: 10
  DEFAULT_TAG: ${{ github.ref_name }}
  BASE_IMG: quay.io/centos/centos:stream10

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for updates
        if: ${{ github.event_name == 'schedule' }}  # Only run if triggered by schedule
        run: |
          upd=0
          podman run --quiet --rm ${{ env.IMAGE_FULL }}:${{ env.DEFAULT_TAG }} dnf check-update || upd=$?

          echo "upd=${upd}" >> "$GITHUB_ENV"
          echo "Exit code from dnf check-update: '${upd}'"

      - name: Set date tag
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        id: date
        run: |
            echo "DATE_TAG=${DEFAULT_TAG}.$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Build
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        uses: redhat-actions/buildah-build@v2.13
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: |
            ${{ env.DEFAULT_TAG }}
            ${{ env.DATE_TAG }}
          containerfiles: ./Containerfile
          build-args: |
            BASE_IMG=${{ env.BASE_IMG }}
          extra-args: |
            --cap-add=all
            --security-opt=label=type:container_runtime_t
            --skip-unused-stages=false
            --device /dev/fuse

      - name: Rechunk
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        run: |
          set -euo pipefail
          export CHUNKAH_CONFIG_STR="$(podman inspect "${{ env.IMAGE_FULL }}:${{ env.DEFAULT_TAG }}")"
          podman run --rm \
            --mount=type=image,src="${{ env.IMAGE_FULL }}:${{ env.DEFAULT_TAG }}",target=/chunkah \
            -e CHUNKAH_CONFIG_STR="$CHUNKAH_CONFIG_STR" \
            quay.io/coreos/chunkah build \
            --prune /sysroot/ --label ostree.commit- --label ostree.final-diffid- \
            --label containers.bootc=1 --compressed --max-layers 128 \
            --tag ${{ env.IMAGE_FULL }}:${{ env.DEFAULT_TAG }} \
          | podman load

      - name: GHCR Login
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        uses: redhat-actions/podman-login@v1.7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        uses: redhat-actions/push-to-registry@v2.8
        id: "push"
        with:
          image: ${{ env.IMAGE_NAME }}
          registry: ghcr.io/s33po
          tags: |
            ${{ env.DEFAULT_TAG }}
            ${{ env.DATE_TAG }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image by digest
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        shell: "bash"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
          IMG: ${{ env.IMAGE_FULL }}
        run: |
          set -euo pipefail
          cosign sign --yes \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMG}@${DIGEST}"
