include:
  - minimal-plus/manifest.yaml
  - standard/autoupdates.yaml
  - standard/system-configuration.yaml
  - standard/persistent-journal.yaml
  - standard/initramfs-full.yaml
  - standard/generic-growfs.yaml

packages:
  - zstd
  - python3-rpm
  - dnf-yum
  - dnf-bootc
  - plymouth
  - plymouth-system-theme

exclude-packages:
  - kernel-debug-uki-virt
  - kernel-uki-virt
  - atheros-firmware
  - brcmfmac-firmware
  - cirrus-audio-firmware
  - intel-audio-firmware
  - intel-gpu-firmware
  - mt7xxx-firmware
  - nvidia-gpu-firmware
  - nxpwireless-firmware
  - realtek-firmware
  - tiwilink-firmware
  - perl
  - perl-interpreter
  - nodejs
  - grubby
  - initscripts
  - NetworkManager-initscripts-ifcfg-rh
  - iptables-legacy
  - systemd-networkd

postprocess:
  - |
    #!/usr/bin/env bash
    set -xeuo pipefail
    mkdir -p /etc/dracut.conf.d
    echo 'add_dracutmodules+=" plymouth "' > /etc/dracut.conf.d/plymouth.conf
    mkdir -p /etc/plymouth
    cat > /etc/plymouth/plymouthd.conf <<EOF
    [Daemon]
    Theme=spinner
    EOF
    mkdir -p /usr/lib/bootc/kargs.d
    cat > /usr/lib/bootc/kargs.d/plymouth.toml <<EOF
    kargs = ["splash", "quiet", "loglevel=2"]
    EOF
  - |
    #!/usr/bin/env bash
    set -euo pipefail
    mkdir -p /usr/lib/bootc/install/
    cat > /usr/lib/bootc/install/20-rhel.toml << EOF
    [install]
    root-fs-type = "xfs"
    EOF
  - |
    #!/usr/bin/env bash
    set -euo pipefail
    systemctl preset-all
