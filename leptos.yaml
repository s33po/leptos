recommends: true

include:
  - minimal-plus/manifest.yaml
  - standard/autoupdates.yaml
  - standard/system-configuration.yaml
  - standard/persistent-journal.yaml
  - standard/generic-growfs.yaml

packages:
  - zstd
  - python3-rpm
  - man-db
  - dnf-yum
  - dnf-bootc
  - plymouth
  - plymouth-system-theme

exclude-packages:
  - kernel-debug-uki-virt
  - kernel-uki-virt
  - atheros-firmware
  - brcmfmac-firmware
  - cirrus-audio-firmware
  - intel-audio-firmware
  - intel-gpu-firmware
  - mt7xxx-firmware
  - nvidia-gpu-firmware
  - nxpwireless-firmware
  - realtek-firmware
  - tiwilink-firmware
  - perl
  - perl-interpreter
  - nodejs
  - grubby
  - initscripts
  - NetworkManager-initscripts-ifcfg-rh
  - iptables-legacy
  - systemd-networkd

postprocess:
  - |
    #!/usr/bin/env bash
    set -xeuo pipefail
    mkdir -p /usr/lib/dracut/dracut.conf.d
    cat > /usr/lib/dracut/dracut.conf.d/30-bootc-standard.conf << 'EOF'
    add_dracutmodules+=" plymouth lvm crypt fips "
    EOF
  - |
    #!/usr/bin/env bash
    set -euo pipefail
    mkdir -p /usr/lib/bootc/install/
    cat > /usr/lib/bootc/install/20-rhel.toml << EOF
    [install]
    root-fs-type = "xfs"
    EOF
  - |
    #!/usr/bin/env bash
    set -euo pipefail
    dnf clean all
    systemctl preset-all
