packages:
  - dnf-yum
  - dnf-bootc

exclude-packages:
  - kernel-debug-uki-virt
  - kernel-uki-virt
  - atheros-firmware
  - brcmfmac-firmware
  - cirrus-audio-firmware
  - intel-audio-firmware
  - intel-gpu-firmware
  - mt7xxx-firmware
  - nvidia-gpu-firmware
  - nxpwireless-firmware
  - realtek-firmware
  - tiwilink-firmware

postprocess:
  - |
    #!/usr/bin/env bash

    set -euo pipefail

    mkdir -p /usr/lib/bootc/install/
    cat > /usr/lib/bootc/install/20-rhel.toml << EOF
    [install]
    root-fs-type = "xfs"
    EOF
  - |
    #!/usr/bin/env bash
    set -euo pipefail
    dnf clean all
    rm /var/{log,cache,lib}/* -rf
    systemctl preset-all

include:
  - standard/manifest.yaml
